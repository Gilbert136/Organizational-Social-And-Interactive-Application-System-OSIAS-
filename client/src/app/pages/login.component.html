<!--this is for UltimateAbusua login component-->

<div class="app flex-row align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card-group mb-0">
          <div class="card p-4">
            <div class="card-body">
              <form (submit) = "authuser()">
                <h1>Login</h1>
                <p class="text-muted">Sign In to your account</p>
                
                <div *ngIf = "error" >
                  <div class = "alert alert-danger">
                    {{error}}
                  </div>
                </div>
              
                <div class="input-group mb-3">
                  <span class="input-group-addon"><i class="fa fa-user"></i></span>
                  <input type="text" class="form-control" [(ngModel)] = "user.username" name = "username" placeholder="Username">
                </div>
                <div class="input-group mb-4">
                  <span class="input-group-addon"><i class="fa fa-lock"></i></span>
                  <input type="password" class="form-control" [(ngModel)] = "user.password" name = "password" placeholder="Password">
                </div>
                <div class="row">
                  <div class="col-6">
                    <input type="submit" class="btn btn-primary px-4" value="Login">
                  </div>
                  <div class="col-6">
                    <button type="button" class="btn btn-primary d-lg-none float-right" [routerLink]="['/pages/register']">Register Now!</button>
                  </div>
                </div>
              </form>
              <div class="text-center mt-4">
                <a href="#">OSIAS&nbsp;</a>
                <span class="text-muted">&copy; 2018 &nbsp; Copyrights All Rights Reserved</span>
              </div>
            </div>
          </div>
          <div class="card text-white bg-primary py-5 d-md-down-none" style="width:44%">
            <div class="card-body text-center">
              <div>
                <h2>Sign up</h2>
                <p><b>Welcome to OSIAS, Sign Up to be a member of this organisation. You can only register once. Please obey the law. If there is any problem, see one of the administrators. <br/> Thank you</b></p>
                <button type="button" class="btn btn-primary active mt-3" [routerLink]="['/pages/register']">Register Now!</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
